[package]
name = "por_digest_anchor"
version = "0.1.0"
edition = "2021"
publish = false
description = "Stores Proof-of-Reserves assessment digests. Does not verify reserves or hold funds."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.5.0"

[dev-dependencies]
near-sdk = { version = "=5.5.0", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
