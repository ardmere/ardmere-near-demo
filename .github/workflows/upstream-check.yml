name: upstream-check

# Detects drift between the vendored ardmere assessments and fixtures/digests.json.
# No chain access, no keys. Opening a PR is a report, not a publish.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "fixtures/digests.json"
      - "scripts/upstream_check.py"

permissions:
  contents: write
  pull-requests: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Advance the submodule to upstream main
        run: |
          git -C vendor/ardmere.github.io fetch origin main --depth 1
          git -C vendor/ardmere.github.io checkout FETCH_HEAD

      - name: Report drift
        id: report
        continue-on-error: true
        run: python3 scripts/upstream_check.py

      - name: Refresh the manifest and open a PR
        if: steps.report.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/upstream_check.py --update
          git config user.name "ardmere-bot"
          git config user.email "bot@ardmere.invalid"
          git checkout -B cursor/upstream-sync
          git add fixtures/digests.json vendor/ardmere.github.io
          git commit -m "chore: follow upstream ardmere assessments"
          git push --force origin cursor/upstream-sync
          gh pr create --base main --head cursor/upstream-sync \
            --title "Follow upstream ardmere assessments" \
            --body "Automated drift check. Review the changed hashes before merging; merging this does not anchor anything. The anchor workflow runs after merge." \
            || gh pr edit cursor/upstream-sync --title "Follow upstream ardmere assessments"

      - name: Fail the job when drift is unresolved
        if: steps.report.outcome == 'failure'
        run: |
          echo "drift detected; see the cursor/upstream-sync PR" >&2
          exit 1
